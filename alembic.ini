# Alembic configuration for Zerodha MCP — PostgreSQL 17 on Oracle VM.
#
# DATABASE_URL is read from the environment (set in /etc/zerodha-mcp/.env).
# Do NOT hardcode credentials here — this file is committed to git.

[alembic]
# migrations/ directory relative to this file
script_location = migrations

# Migration file naming: 0001_description.py
file_template = %%(rev)s_%%(slug)s

# Truncate long slug names at 40 chars
truncate_slug_length = 40

# Timezone for generated migration file timestamps
timezone = Asia/Kolkata

# prepend_sys_path allows importing from src/
prepend_sys_path = .

# DATABASE_URL is set at runtime from the environment — see migrations/env.py
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
