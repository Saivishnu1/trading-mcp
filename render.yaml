services:
  - type: web
    name: zerodha-mcp
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ZERODHA_USER_ID
        sync: false
      - key: ZERODHA_PASSWORD
        sync: false
      - key: ZERODHA_TOTP_SECRET
        sync: false
      - key: BROKER_BACKEND
        value: zerodha_web
      - key: SESSION_FILE
        value: /tmp/.session.json
      - key: LOG_LEVEL
        value: INFO
