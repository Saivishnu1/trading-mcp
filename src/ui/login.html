<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Zerodha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
{shared_head}
<style>
  /* ── Login-page-specific layout only — tokens/components/nav come from
     the shared design system (Phase 1). The server injects fixed markup
     into {message}/{guest_btn}/#api-key using specific class/id names
     (.alert.ok, .alert.err, #api-key, .guest-btn) — see server.py's
     _handle_login_get/_handle_login_post. Those names are a contract
     with the backend and are kept exactly; only their visual styling
     changes here. ── */

  .login-center { min-height: 100vh; }

  .auth-card {
    width: 100%;
    max-width: 420px;
  }

  .masthead {
    display: flex; align-items: center; gap: var(--space-3);
    margin-bottom: var(--space-6);
  }
  .masthead-name { font-size: var(--text-body-m); font-weight: var(--weight-semibold); }
  .masthead-sub  { font-size: var(--text-body-s); color: var(--content-tertiary); }

  .form-head { margin-bottom: var(--space-5); }
  .form-head h1 {
    font-size: var(--text-title-l);
    font-weight: var(--weight-bold);
    letter-spacing: -0.01em;
    margin-bottom: var(--space-1);
  }
  .form-head p { font-size: var(--text-body-s); color: var(--content-tertiary); margin: 0; }

  /* Server-injected alert — kept as .alert.ok/.alert.err (backend
     contract), styled to match the shared .banner visual language. */
  .alert {
    display: flex; align-items: flex-start; gap: var(--space-2);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-sm);
    font-size: var(--text-body-s);
    line-height: var(--leading-normal);
    border: 1px solid transparent;
    margin-bottom: var(--space-4);
  }
  .alert.ok  { background: var(--buy-surface); color: var(--buy); border-color: var(--buy); }
  .alert.err { background: var(--sell-surface); color: var(--sell); border-color: var(--sell); }

  .field-hint {
    font-size: var(--text-body-s); color: var(--sell);
    margin-top: var(--space-1);
    display: none;
  }
  .field.invalid input { border-color: var(--sell); }
  .field.invalid .field-hint { display: block; }

  .pw-field-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: var(--space-2);
    color: var(--content-tertiary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; min-height: 32px; border-radius: var(--radius-sm);
  }
  .pw-toggle:hover { color: var(--content-secondary); background: var(--surface-2); }
  input.has-toggle { padding-right: 40px; }

  .submit-row { margin-top: var(--space-5); }

  .sec-note {
    display: flex; align-items: center; gap: var(--space-2);
    margin-top: var(--space-5); padding: var(--space-3);
    background: var(--accent-surface); border: 1px solid var(--accent);
    border-radius: var(--radius-sm); font-size: var(--text-body-s); color: var(--content-secondary);
  }
  .sec-note .icon { color: var(--accent); flex-shrink: 0; }

  .divider {
    display: flex; align-items: center; gap: var(--space-3);
    margin: var(--space-5) 0;
    font-size: var(--text-body-s); color: var(--content-tertiary);
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border-subtle);
  }

  /* Server-injected guest link — kept as .guest-btn (backend contract) */
  .guest-btn {
    display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    width: 100%; min-height: var(--touch-target-min);
    padding: var(--space-3) var(--space-4);
    text-align: center; text-decoration: none;
    font-size: var(--text-body-m); font-weight: var(--weight-semibold);
    color: var(--content-primary);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    transition: border-color var(--dur-micro) var(--ease-standard), background var(--dur-micro) var(--ease-standard);
  }
  .guest-btn:hover { border-color: var(--accent); background: var(--accent-surface); text-decoration: none; }

  /* Success state */
  .success-header {
    display: flex; align-items: center; gap: var(--space-3);
    margin-bottom: var(--space-5);
  }
  .success-icon {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: var(--buy-surface); color: var(--buy);
    display: flex; align-items: center; justify-content: center;
  }
  .success-title { font-size: var(--text-title-m); font-weight: var(--weight-bold); }
  .success-sub { font-size: var(--text-body-s); color: var(--content-tertiary); margin-top: 2px; }

  .continue-btn { margin-bottom: var(--space-4); }

  /* Collapsible AI-client section — secondary, closed by default */
  .ai-setup-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: var(--space-3) 0;
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: var(--content-secondary); font-size: var(--text-body-m); font-weight: var(--weight-medium);
    min-height: var(--touch-target-min);
  }
  .ai-setup-toggle:hover { color: var(--content-primary); }
  .ai-setup-chevron { transition: transform var(--dur-transition) var(--ease-standard); }
  .ai-setup-toggle[aria-expanded="true"] .ai-setup-chevron { transform: rotate(180deg); }
  .ai-setup-panel { display: none; padding-top: var(--space-3); }
  .ai-setup-panel.open { display: block; }

  .key-box {
    background: var(--surface-2); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-4);
  }
  .key-caption { font-size: var(--text-body-s); color: var(--content-tertiary); margin-bottom: var(--space-2); }
  .key-caption strong { color: var(--accent); font-weight: var(--weight-medium); }
  .key-row { display: flex; align-items: center; gap: var(--space-2); }
  .key-val {
    flex: 1; font-family: var(--font-mono); font-size: var(--text-body-s); color: var(--buy);
    word-break: break-all; line-height: var(--leading-normal);
    filter: blur(4px); user-select: none; transition: filter var(--dur-transition) var(--ease-standard);
  }
  .key-val.show { filter: none; user-select: text; }

  .setup-tabs {
    display: flex; gap: var(--space-1); overflow-x: auto; margin-bottom: var(--space-3);
    scrollbar-width: none; border-bottom: 1px solid var(--border-subtle);
  }
  .setup-tabs::-webkit-scrollbar { display: none; }
  .setup-tab {
    padding: var(--space-2) var(--space-3);
    font-size: var(--text-body-s); font-weight: var(--weight-medium);
    color: var(--content-tertiary); background: none; border: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: pointer; white-space: nowrap; font-family: inherit;
    min-height: var(--touch-target-min);
  }
  .setup-tab:hover { color: var(--content-secondary); }
  .setup-tab.on { color: var(--content-primary); border-bottom-color: var(--accent); }
  .setup-panel { display: none; }
  .setup-panel.on { display: block; }
  .setup-panel p { font-size: var(--text-body-s); color: var(--content-secondary); margin: 0 0 var(--space-2); line-height: var(--leading-normal); }
  .setup-panel p strong { color: var(--content-primary); font-weight: var(--weight-semibold); }
  code.inline { font-family: var(--font-mono); font-size: 0.85em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  .code-wrap { position: relative; }
  .code-block {
    background: var(--surface-0); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4) var(--space-7);
    font-family: var(--font-mono); font-size: 12px; color: var(--content-secondary); line-height: 1.7;
    overflow-x: auto; white-space: pre;
  }
  .copy-code-btn {
    position: absolute; bottom: var(--space-2); right: var(--space-2);
  }

  .done-btn { margin-top: var(--space-4); }

  .icon { width: 18px; height: 18px; stroke-width: 2; flex-shrink: 0; }
  .icon-sm { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="page-shell">
{nav}
<div class="page-shell-content login-center">
<div class="card card-pad auth-card" id="main-card">

  <div class="masthead">
    <div>
      <div class="masthead-name">Zerodha</div>
      <div class="masthead-sub">Personal Trading Server</div>
    </div>
  </div>

  <div id="form-section">
    <div class="form-head">
      <h1>Sign in</h1>
      <p>Enter your Kite credentials to continue</p>
    </div>

    {message}

    <form method="POST" action="/login" autocomplete="off" id="login-form" novalidate>
      <div class="field" id="field-user-id">
        <label for="input-user-id">Client ID</label>
        <input id="input-user-id" name="user_id" value="{prefill_user_id}" placeholder="ZK1234"
               required autocomplete="off" aria-describedby="hint-user-id">
        <div class="field-hint" id="hint-user-id">Client ID is required.</div>
      </div>
      <div class="field" id="field-password">
        <label for="input-password">Password</label>
        <div class="pw-field-wrap">
          <input id="input-password" type="password" name="password" placeholder="Kite password"
                 required autocomplete="new-password" class="has-toggle" aria-describedby="hint-password">
          <button type="button" class="pw-toggle" id="pw-toggle-password" aria-label="Show password" aria-pressed="false">
            <i data-lucide="eye" class="icon icon-sm"></i>
          </button>
        </div>
        <div class="field-hint" id="hint-password">Password is required.</div>
      </div>
      <div class="field" id="field-totp">
        <label for="input-totp">TOTP</label>
        <input id="input-totp" type="password" name="totp_code" placeholder="6-digit code" maxlength="6"
               required autocomplete="off" inputmode="numeric" pattern="[0-9]{6}" aria-describedby="hint-totp">
        <div class="field-hint" id="hint-totp">Enter the 6-digit code from your authenticator.</div>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
          <span id="submit-btn-label">Sign in securely</span>
          <span class="spinner hidden" id="spinner" aria-hidden="true"></span>
        </button>
      </div>
    </form>

    <div class="sec-note">
      <i data-lucide="shield-check" class="icon"></i>
      <span>Credentials go directly to the server — never through the AI agent</span>
    </div>

    <div class="divider">or</div>

    {guest_btn}
  </div>

</div>
</div>
</div>

<script>
  // Password visibility toggle — icon-only button, accessible via
  // aria-label/aria-pressed rather than relying on a title tooltip alone.
  document.getElementById('pw-toggle-password').addEventListener('click', function () {
    var input = document.getElementById('input-password');
    var btn = this;
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-pressed', String(!showing));
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    btn.innerHTML = showing
      ? '<i data-lucide="eye" class="icon icon-sm"></i>'
      : '<i data-lucide="eye-off" class="icon icon-sm"></i>';
    if (window.lucide) lucide.createIcons();
  });

  // Inline validation feedback — required fields + TOTP digit pattern.
  // Server remains the source of truth for real auth errors; this only
  // catches empty/malformed input before a network round trip.
  function validateField(fieldId, inputId, isValid) {
    var field = document.getElementById(fieldId);
    field.classList.toggle('invalid', !isValid);
    return isValid;
  }
  document.getElementById('login-form').addEventListener('submit', function (e) {
    var userId = document.getElementById('input-user-id');
    var password = document.getElementById('input-password');
    var totp = document.getElementById('input-totp');

    var ok = true;
    ok = validateField('field-user-id', 'input-user-id', userId.value.trim().length > 0) && ok;
    ok = validateField('field-password', 'input-password', password.value.length > 0) && ok;
    ok = validateField('field-totp', 'input-totp', /^[0-9]{6}$/.test(totp.value.trim())) && ok;

    if (!ok) {
      e.preventDefault();
      var firstInvalid = document.querySelector('.field.invalid input');
      if (firstInvalid) firstInvalid.focus();
      return;
    }

    var btn = document.getElementById('submit-btn');
    var label = document.getElementById('submit-btn-label');
    var sp = document.getElementById('spinner');
    btn.disabled = true;
    label.textContent = 'Signing in…';
    sp.classList.remove('hidden');
  });

  // Success: build the post-login state. Server injects the API key as
  // <span id="api-key" style="display:none"> inside {message}, and
  // signals success via class="alert ok" — both are backend contracts,
  // read here unchanged.
  (function () {
    if (!document.querySelector('.alert.ok')) return;

    var apiKey = '';
    var keyEl = document.getElementById('api-key');
    if (keyEl) { apiKey = keyEl.textContent.trim(); keyEl.remove(); }

    var sseUrl = window.location.origin + '/sse';
    var cfgJson = JSON.stringify({
      mcpServers: { zerodha: { url: sseUrl, headers: { Authorization: 'Bearer ' + apiKey } } }
    }, null, 2);
    var ccCmd = 'claude mcp add --transport sse zerodha ' + sseUrl + '\n  --header "Authorization: Bearer ' + apiKey + '"';
    var bearer = 'Bearer ' + apiKey;

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    var apiKeySection = apiKey ? [
      '<div class="key-box">',
      '  <div class="key-caption">Your API key — <strong>keep it private</strong></div>',
      '  <div class="key-row">',
      '    <span class="key-val" id="api-key-display">' + esc(apiKey) + '</span>',
      '    <button class="btn btn-ghost btn-icon" id="eye-btn" type="button" aria-label="Show API key" aria-pressed="false"><i data-lucide="eye" class="icon icon-sm"></i></button>',
      '    <button class="btn btn-ghost btn-sm" id="copy-key-btn" type="button">Copy</button>',
      '  </div>',
      '</div>',
    ].join('') : '';

    document.getElementById('form-section').innerHTML = [
      '<div class="success-header">',
      '  <div class="success-icon"><i data-lucide="check" class="icon"></i></div>',
      '  <div>',
      '    <h1 class="success-title">Signed in</h1>',
      '    <div class="success-sub">Zerodha session is active</div>',
      '  </div>',
      '</div>',

      '<a href="/positions" class="btn btn-primary btn-block btn-lg continue-btn">',
      '  <i data-lucide="line-chart" class="icon"></i>Continue to Positions',
      '</a>',

      apiKeySection,

      '<button type="button" class="ai-setup-toggle" id="ai-setup-toggle" aria-expanded="false" aria-controls="ai-setup-panel">',
      '  <span><i data-lucide="bot" class="icon icon-sm" style="margin-right:8px;vertical-align:-2px"></i>Connect an AI client instead</span>',
      '  <i data-lucide="chevron-down" class="icon icon-sm ai-setup-chevron"></i>',
      '</button>',

      '<div class="ai-setup-panel" id="ai-setup-panel">',
      '  <div class="setup-tabs" data-tab-group>',
      '    <button class="setup-tab on" data-tab-btn type="button" onclick="switchTab(this,\'cc\')">Claude Code</button>',
      '    <button class="setup-tab" data-tab-btn type="button" onclick="switchTab(this,\'ai\')">claude.ai</button>',
      '    <button class="setup-tab" data-tab-btn type="button" onclick="switchTab(this,\'cd\')">Claude Desktop</button>',
      '    <button class="setup-tab" data-tab-btn type="button" onclick="switchTab(this,\'cur\')">Cursor</button>',
      '    <button class="setup-tab" data-tab-btn type="button" onclick="switchTab(this,\'pm\')">Postman</button>',
      '  </div>',

      '  <div data-tab-panel="cc" class="setup-panel on">',
      '    <p>Run once in your terminal:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-cc">' + esc(ccCmd) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-cc\').textContent,this)">Copy</button></div>',
      '  </div>',

      '  <div data-tab-panel="ai" class="setup-panel">',
      '    <p>Settings → Integrations → <strong>Add MCP Server</strong>. Paste the SSE URL, then add the Authorization header to unlock personal tools.</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-ai-url">' + esc(sseUrl) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-ai-url\').textContent,this)">Copy</button></div>',
      '    <p style="margin-top:12px">Authorization header value:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-ai-hdr">' + esc(bearer) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-ai-hdr\').textContent,this)">Copy</button></div>',
      '  </div>',

      '  <div data-tab-panel="cd" class="setup-panel">',
      '    <p>Edit <code class="inline">claude_desktop_config.json</code><br>Mac: <code class="inline">~/Library/Application Support/Claude/</code><br>Win: <code class="inline">%APPDATA%\\Claude\\</code></p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-cd">' + esc(cfgJson) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-cd\').textContent,this)">Copy</button></div>',
      '  </div>',

      '  <div data-tab-panel="cur" class="setup-panel">',
      '    <p>Add to <code class="inline">.cursor/mcp.json</code> in your project root:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-cur">' + esc(cfgJson) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-cur\').textContent,this)">Copy</button></div>',
      '  </div>',

      '  <div data-tab-panel="pm" class="setup-panel">',
      '    <p>New → MCP Server → <strong>SSE</strong> → paste the URL, then add the Authorization header:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-pm-url">' + esc(sseUrl) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-pm-url\').textContent,this)">Copy</button></div>',
      '    <p style="margin-top:12px">Authorization header value:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-pm-hdr">' + esc(bearer) + '</div><button class="btn btn-ghost btn-sm copy-code-btn" type="button" onclick="copyToClipboard(document.getElementById(\'blk-pm-hdr\').textContent,this)">Copy</button></div>',
      '  </div>',
      '</div>',

      '<button type="button" class="btn btn-secondary btn-block done-btn" onclick="window.close()">Done — close this tab</button>',
    ].join('\n');

    if (window.lucide) lucide.createIcons();

    var toggleBtn = document.getElementById('ai-setup-toggle');
    var panel = document.getElementById('ai-setup-panel');
    toggleBtn.addEventListener('click', function () {
      var open = panel.classList.toggle('open');
      toggleBtn.setAttribute('aria-expanded', String(open));
    });

    var eyeBtn = document.getElementById('eye-btn');
    if (eyeBtn) {
      eyeBtn.addEventListener('click', function () {
        var el = document.getElementById('api-key-display');
        var showing = el.classList.toggle('show');
        eyeBtn.setAttribute('aria-pressed', String(showing));
        eyeBtn.setAttribute('aria-label', showing ? 'Hide API key' : 'Show API key');
        eyeBtn.innerHTML = showing
          ? '<i data-lucide="eye-off" class="icon icon-sm"></i>'
          : '<i data-lucide="eye" class="icon icon-sm"></i>';
        if (window.lucide) lucide.createIcons();
      });
    }
    var copyKeyBtn = document.getElementById('copy-key-btn');
    if (copyKeyBtn) {
      copyKeyBtn.addEventListener('click', function () {
        copyToClipboard(document.getElementById('api-key-display').textContent.trim(), copyKeyBtn);
      });
    }
  })();

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
