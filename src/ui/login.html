<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerodha Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 50px rgba(0,0,0,.5);
    animation: slideUp .35s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 2rem;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #387ED1, #56cfb2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; color: #fff;
  }
  .logo-text { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
  .logo-sub  { font-size: .75rem; color: #64748b; }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    color: #f1f5f9;
    margin-bottom: .35rem;
  }
  .subtitle {
    font-size: .85rem;
    color: #64748b;
    margin-bottom: 1.75rem;
  }

  .field { margin-bottom: 1.1rem; }
  label  { display: block; font-size: .8rem; color: #94a3b8; margin-bottom: .4rem; font-weight: 500; }

  input {
    width: 100%;
    padding: .65rem .9rem;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    font-size: .95rem;
    color: #f1f5f9;
    transition: border-color .2s;
  }
  input::placeholder { color: #475569; }
  input:focus { outline: none; border-color: #387ED1; }

  button {
    width: 100%;
    padding: .75rem;
    margin-top: .5rem;
    background: linear-gradient(135deg, #387ED1, #2d6cb8);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    position: relative;
  }
  button:hover   { opacity: .9; }
  button:active  { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: not-allowed; }

  .spinner {
    display: none;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
  }
  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

  .msg {
    display: flex; align-items: flex-start; gap: .6rem;
    margin-bottom: 1.25rem;
    padding: .85rem 1rem;
    border-radius: 8px;
    font-size: .875rem;
    line-height: 1.4;
  }
  .msg-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: .05rem; }
  .ok  { background: rgba(34,197,94,.12); color: #4ade80; border: 1px solid rgba(34,197,94,.2); }
  .err { background: rgba(239,68,68,.12);  color: #f87171; border: 1px solid rgba(239,68,68,.2);  }

  .api-key-box {
    margin-top: 1.25rem;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 1rem;
  }
  .api-key-label {
    font-size: .78rem;
    color: #94a3b8;
    margin-bottom: .5rem;
    font-weight: 500;
  }
  .api-key-label span { color: #f59e0b; font-weight: 400; }
  .api-key-row {
    display: flex; align-items: center; gap: .5rem;
    margin-bottom: .75rem;
  }
  .api-key-box code {
    flex: 1;
    font-family: monospace;
    font-size: .8rem;
    color: #56cfb2;
    word-break: break-all;
    line-height: 1.5;
    filter: blur(5px);
    user-select: none;
    transition: filter .2s;
  }
  .api-key-box code.visible {
    filter: none;
    user-select: text;
  }
  .eye-btn {
    width: 30px; height: 30px; flex-shrink: 0; margin-top: 0; padding: 0;
    background: transparent; border: 1px solid #334155; border-radius: 6px;
    color: #64748b; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s;
  }
  .eye-btn:hover { border-color: #475569; color: #94a3b8; }
  .api-key-box .copy-btn {
    width: auto;
    padding: .4rem .9rem;
    font-size: .8rem;
    background: #334155;
    margin-top: 0;
    flex-shrink: 0;
  }
  .api-key-box .copy-btn:hover { background: #475569; }

  .security-note {
    display: flex; align-items: center; gap: .5rem;
    margin-top: 1.5rem;
    padding: .7rem .9rem;
    background: rgba(56,126,209,.08);
    border: 1px solid rgba(56,126,209,.15);
    border-radius: 8px;
    font-size: .78rem;
    color: #64748b;
  }
  .security-note span { color: #387ED1; font-size: 1rem; }

  .success-card { padding: .5rem 0; }
  .success-header {
    display: flex; align-items: center; gap: .75rem;
    margin-bottom: 1.5rem;
  }
  .success-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    background: rgba(74,222,128,.15);
    border: 1px solid rgba(74,222,128,.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    animation: pop .4s ease;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .success-header h2 { color: #4ade80; font-size: 1.05rem; margin: 0; }
  .success-header p  { color: #64748b; font-size: .78rem; margin: .15rem 0 0; }

  .setup-steps { margin-top: 1.25rem; }
  .step {
    margin-bottom: 1.25rem;
  }
  .step-label {
    font-size: .72rem; font-weight: 600; letter-spacing: .05em;
    color: #387ED1; text-transform: uppercase; margin-bottom: .5rem;
  }
  .step p { font-size: .8rem; color: #94a3b8; margin-bottom: .5rem; }

  .tabs {
    display: flex; gap: .35rem; margin-bottom: .75rem; flex-wrap: wrap;
  }
  .tab {
    width: auto; margin-top: 0; padding: .3rem .75rem;
    font-size: .75rem; font-weight: 500;
    border-radius: 6px; border: 1px solid #334155;
    background: #0f172a; color: #64748b; cursor: pointer;
    transition: all .15s;
  }
  .tab.active {
    background: rgba(56,126,209,.15); border-color: rgba(56,126,209,.4);
    color: #387ED1;
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .code-wrap {
    position: relative;
  }
  .code-block {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: .7rem .7rem 2.2rem;
    font-family: monospace; font-size: .72rem;
    color: #e2e8f0; line-height: 1.6;
    overflow-x: auto; white-space: pre;
  }
  .copy-code-btn {
    position: absolute; bottom: .5rem; right: .5rem;
    width: auto; margin-top: 0; padding: .2rem .6rem;
    font-size: .68rem; font-weight: 500;
    background: #334155; border: 1px solid #475569;
    border-radius: 4px; color: #94a3b8; cursor: pointer;
    transition: background .15s;
  }
  .copy-code-btn:hover { background: #475569; color: #f1f5f9; }

  .close-btn {
    display: block; width: 100%; margin-top: 1.5rem;
    padding: .65rem; font-size: .875rem;
    background: rgba(56,126,209,.1); border: 1px solid rgba(56,126,209,.25);
    border-radius: 8px; color: #387ED1; cursor: pointer;
    transition: background .15s;
  }
  .close-btn:hover { background: rgba(56,126,209,.2); }
</style>
</head>
<body>
<div class="card" id="main-card">
  <div class="logo">
    <div class="logo-icon">Z</div>
    <div>
      <div class="logo-text">Zerodha MCP</div>
      <div class="logo-sub">Personal Trading Server</div>
    </div>
  </div>

  <div id="form-section">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your Kite credentials to authenticate</p>

    {message}

    <form method="POST" action="/login" autocomplete="off" id="login-form">
      <div class="field">
        <label>Client ID</label>
        <input name="user_id" value="{prefill_user_id}" placeholder="ZK1234" required autocomplete="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Kite password" required autocomplete="new-password">
      </div>
      <div class="field">
        <label>TOTP (6-digit code)</label>
        <input type="password" name="totp_code" placeholder="123456" maxlength="6" required autocomplete="off" inputmode="numeric">
      </div>
      <button type="submit" id="submit-btn">
        Log in securely
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div class="security-note">
      <span>&#128274;</span>
      Credentials go directly to the server — never through the AI agent
    </div>
  </div>
</div>

<script>
  function copyKey() {
    var key = document.getElementById('api-key');
    if (!key) return;
    navigator.clipboard.writeText(key.textContent.trim()).then(function() {
      var btn = document.querySelector('.copy-btn') || key.nextElementSibling;
      if (btn) { btn.textContent = 'Copied!'; setTimeout(function(){ btn.textContent = 'Copy'; }, 2000); }
    });
  }

  var _eyeOff = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  var _eyeOn  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';

  function toggleKey() {
    var key = document.getElementById('api-key');
    var btn = document.getElementById('eye-btn');
    if (!key) return;
    var visible = key.classList.toggle('visible');
    btn.innerHTML = visible ? _eyeOn : _eyeOff;
    btn.title = visible ? 'Hide key' : 'Show key';
  }

  // Show loading state on submit
  document.getElementById('login-form').addEventListener('submit', function() {
    var btn = document.getElementById('submit-btn');
    var spinner = document.getElementById('spinner');
    btn.disabled = true;
    btn.childNodes[0].textContent = 'Signing in…';
    spinner.style.display = 'block';
  });

  // Setup guide on success
  (function() {
    if (!document.querySelector('.msg.ok')) return;

    var apiKey  = (document.getElementById('api-key') || {}).textContent || '';
    apiKey = apiKey.trim();
    var mcpUrl  = window.location.origin + '/mcp';

    var eyeOff = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    var eyeOn  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';

    var cfgJson = JSON.stringify({
      mcpServers: { zerodha: { url: mcpUrl, headers: { Authorization: 'Bearer ' + apiKey } } }
    }, null, 2);
    var codeCmd = 'claude mcp add --transport http zerodha ' + mcpUrl + '\n  --header "Authorization: Bearer ' + apiKey + '"';

    document.getElementById('form-section').innerHTML = [
      '<div class="success-card">',

      // Header
      '<div class="success-header">',
      '  <div class="success-icon">&#10003;</div>',
      '  <div><h2>Logged in</h2><p>Zerodha session active</p></div>',
      '</div>',

      // API key
      '<div class="step">',
      '  <div class="step-label">Your API Key</div>',
      '  <p>Use this key to authenticate your MCP client. Copy it and keep it safe.</p>',
      '  <div class="api-key-box" style="margin-top:.5rem">',
      '    <p class="api-key-label">MCP API Key</p>',
      '    <div class="api-key-row">',
      '      <code id="api-key">' + escHtml(apiKey) + '</code>',
      '      <button class="eye-btn" onclick="toggleKey()" id="eye-btn" title="Show key">'+eyeOff+'</button>',
      '      <button class="copy-btn" onclick="copyKey()">Copy</button>',
      '    </div>',
      '  </div>',
      '</div>',

      // Setup
      '<div class="step">',
      '  <div class="step-label">Connect your agent</div>',
      '  <p>Choose your client and paste the config below — the key is already filled in.</p>',
      '  <div class="tabs" style="margin-top:.6rem">',
      '    <button class="tab active" onclick="showTab(\'cc\',this)">Claude Code</button>',
      '    <button class="tab" onclick="showTab(\'cd\',this)">Claude Desktop</button>',
      '    <button class="tab" onclick="showTab(\'cur\',this)">Cursor</button>',
      '    <button class="tab" onclick="showTab(\'pm\',this)">Postman</button>',
      '  </div>',

      '  <div id="tab-cc" class="tab-pane active">',
      '    <p>Run once in your terminal:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-cc">' + escHtml(codeCmd) + '</div><button class="copy-code-btn" onclick="copyCode(\'blk-cc\')">Copy</button></div>',
      '  </div>',

      '  <div id="tab-cd" class="tab-pane">',
      '    <p>Add to <strong>claude_desktop_config.json</strong><br>',
      '    Mac: <code style="font-size:.68rem;color:#64748b">~/Library/Application Support/Claude/</code><br>',
      '    Win: <code style="font-size:.68rem;color:#64748b">%APPDATA%\\Claude\\</code></p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-cd">' + escHtml(cfgJson) + '</div><button class="copy-code-btn" onclick="copyCode(\'blk-cd\')">Copy</button></div>',
      '  </div>',

      '  <div id="tab-cur" class="tab-pane">',
      '    <p>Add to <code style="font-size:.68rem;color:#64748b">.cursor/mcp.json</code> in your project:</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-cur">' + escHtml(cfgJson) + '</div><button class="copy-code-btn" onclick="copyCode(\'blk-cur\')">Copy</button></div>',
      '  </div>',

      '  <div id="tab-pm" class="tab-pane">',
      '    <p>In Postman → <strong>New</strong> → <strong>MCP Server</strong> → select <strong>Streamable HTTP</strong>:<br>',
      '    &nbsp;• URL: <code style="font-size:.68rem;color:#64748b">' + escHtml(mcpUrl) + '</code><br>',
      '    &nbsp;• Header: <code style="font-size:.68rem;color:#64748b">Authorization</code> → value below</p>',
      '    <div class="code-wrap"><div class="code-block" id="blk-pm">' + escHtml('Bearer ' + apiKey) + '</div><button class="copy-code-btn" onclick="copyCode(\'blk-pm\')">Copy</button></div>',
      '  </div>',
      '</div>',

      '<button class="close-btn" onclick="window.close()">Done — close this tab</button>',
      '</div>',
    ].join('');
  })();

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showTab(id, btn) {
    document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
  }

  function copyCode(id) {
    var el = document.getElementById(id);
    var btn = el.parentElement.querySelector('.copy-code-btn');
    navigator.clipboard.writeText(el.textContent.trim()).then(function() {
      btn.textContent = 'Copied!';
      setTimeout(function(){ btn.textContent = 'Copy'; }, 2000);
    });
  }
</script>
</body>
</html>
