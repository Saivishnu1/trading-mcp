<!-- Shared navigation partial, injected server-side into every page.
     Two renderings from one markup: nav-rail (side, >=600px) and
     tab-bar (bottom, <600px) — CSS in nav.css picks which one shows. -->
<nav class="nav-rail">
  <div class="nav-rail-brand">Zerodha</div>
  <div class="nav-rail-items">
    <a class="nav-rail-item {active_home}" href="/">
      <i data-lucide="home" class="nav-rail-icon" aria-hidden="true"></i><span class="nav-rail-label">Home</span>
    </a>
    <a class="nav-rail-item {active_positions}" href="/positions">
      <i data-lucide="layers" class="nav-rail-icon" aria-hidden="true"></i><span class="nav-rail-label">Positions</span>
    </a>
    <a class="nav-rail-item {active_trade}" href="/trade">
      <i data-lucide="arrow-left-right" class="nav-rail-icon" aria-hidden="true"></i><span class="nav-rail-label">Trade</span>
    </a>
    <a class="nav-rail-item {active_login}" href="/login">
      <i data-lucide="key-round" class="nav-rail-icon" aria-hidden="true"></i><span class="nav-rail-label">Session</span>
    </a>
  </div>
  <button class="nav-theme-toggle" id="navThemeToggle" type="button" aria-label="Toggle light/dark theme">
    <i data-lucide="sun" class="nav-rail-icon nav-theme-icon-light" aria-hidden="true"></i>
    <i data-lucide="moon" class="nav-rail-icon nav-theme-icon-dark" aria-hidden="true"></i>
    <span class="nav-rail-label" id="navThemeLabel">Theme</span>
  </button>
  <div class="nav-rail-session">
    <span class="status-dot" id="navSessionDot"></span>
    <span class="nav-rail-label" id="navSessionText">Checking…</span>
  </div>
</nav>

<nav class="tab-bar">
  <a class="tab-bar-item {active_home}" href="/">
    <i data-lucide="home" class="tab-bar-icon" aria-hidden="true"></i>Home
  </a>
  <a class="tab-bar-item {active_positions}" href="/positions">
    <i data-lucide="layers" class="tab-bar-icon" aria-hidden="true"></i>Positions
  </a>
  <a class="tab-bar-item {active_trade}" href="/trade">
    <i data-lucide="arrow-left-right" class="tab-bar-icon" aria-hidden="true"></i>Trade
  </a>
  <a class="tab-bar-item {active_login}" href="/login">
    <i data-lucide="key-round" class="tab-bar-icon" aria-hidden="true"></i>Session
  </a>
  <button class="tab-bar-item nav-theme-toggle" id="tabBarThemeToggle" type="button" aria-label="Toggle light/dark theme">
    <i data-lucide="sun" class="tab-bar-icon nav-theme-icon-light" aria-hidden="true"></i>
    <i data-lucide="moon" class="tab-bar-icon nav-theme-icon-dark" aria-hidden="true"></i>
    Theme
  </button>
</nav>

<script>
  // Session indicator — same /auth/status check every page already
  // performs independently today; centralized here so all 4 pages show
  // identical session state without 4 copies of this fetch.
  //
  // Perf pass (2026-07-12): cached in sessionStorage with a 45s TTL so
  // clicking between nav items doesn't refire this on every single page
  // load — a stale-for-45s session indicator is an acceptable trade for
  // one fewer round trip per navigation.
  (function () {
    var CACHE_KEY = 'zerodha_auth_status_cache';
    var TTL_MS = 45000;

    function getCookie(n) {
      var m = document.cookie.match('(?:^|; )' + n + '=([^;]*)');
      return m ? decodeURIComponent(m[1]) : null;
    }
    function render(d) {
      var dot = document.getElementById('navSessionDot');
      var text = document.getElementById('navSessionText');
      if (!dot || !text) return;
      var uid = d.user_id || getCookie('mcp_uid');
      if (d.authenticated || uid) {
        dot.classList.add('live');
        text.textContent = uid ? uid : 'Signed in';
      } else {
        text.textContent = 'Guest';
      }
    }
    function renderOffline() {
      var text = document.getElementById('navSessionText');
      if (text) text.textContent = 'Offline';
    }

    var cached = null;
    try { cached = JSON.parse(sessionStorage.getItem(CACHE_KEY)); } catch (e) {}
    if (cached && Date.now() - cached.t < TTL_MS) {
      render(cached.d);
      return;
    }

    fetch('/auth/status').then(function (r) { return r.json(); }).then(function (d) {
      try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
      render(d);
    }).catch(renderOffline);
  })();

  // Prefetch the destination page on hover/focus of a nav link — by the
  // time a real click lands, the next page's HTML is often already in
  // the HTTP cache. One <link rel="prefetch"> per URL, deduped, since
  // this fires on every hover and nav items get hovered repeatedly.
  (function () {
    var done = {};
    function prefetch(href) {
      if (!href || done[href] || href === location.pathname) return;
      done[href] = true;
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = href;
      document.head.appendChild(link);
    }
    document.querySelectorAll('.nav-rail-item, .tab-bar-item').forEach(function (a) {
      a.addEventListener('mouseenter', function () { prefetch(a.getAttribute('href')); });
      a.addEventListener('focus', function () { prefetch(a.getAttribute('href')); });
    });
  })();

  // Theme toggle — wires the two nav buttons (rail + tab-bar) to the
  // ZTheme API already defined in shared/app.js. Shows a sun icon when
  // the CURRENT theme is dark (i.e. tapping switches TO light) and a
  // moon icon when it's light, matching the common convention of
  // depicting the theme you'll switch to, not the one you're on.
  (function () {
    function currentTheme() {
      if (window.ZTheme && window.ZTheme.get()) return window.ZTheme.get();
      if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
      return 'light';
    }
    function sync() {
      var isDark = currentTheme() === 'dark';
      document.querySelectorAll('.nav-theme-toggle').forEach(function (btn) {
        btn.classList.toggle('is-dark', isDark);
      });
    }
    document.querySelectorAll('.nav-theme-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (window.ZTheme) window.ZTheme.toggle();
        sync();
      });
    });
    window.addEventListener('ztheme:change', sync);
    sync();
  })();
</script>
