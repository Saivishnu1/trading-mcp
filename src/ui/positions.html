<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Positions — Zerodha</title>
{shared_head}
<style>
  /* ── Positions-page-specific layout only — tokens/components/nav from
     the shared design system. Backend contract is UNCHANGED: same
     /positions/data, /ws/prices, /trade/sell, /trade/modify endpoints,
     same request/response shapes. Only markup/CSS/presentation logic
     changed below. ── */

  /* Sticky portfolio summary — desktop and mobile both, per requirement.
     Total P&L is the dominant number on the page. */
  .summary-bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface-0);
    padding: var(--space-3) 0;
    margin-bottom: var(--space-4);
    border-bottom: 1px solid var(--border-subtle);
  }
  .summary-inner { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
  .summary-pnl-label { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 2px; }
  .summary-pnl-value { font-size: var(--text-data-l); }
  .summary-meta { font-size: var(--text-body-s); color: var(--content-tertiary); }
  .conn-badge {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--surface-1); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-full); font-size: var(--text-body-s); color: var(--content-secondary);
  }
  .conn-badge.down { border-color: var(--sell); color: var(--sell); }

  .pin-card { max-width: 420px; }
  .pin-row { display: flex; gap: var(--space-2); align-items: flex-end; }
  .pin-row .field { flex: 1; margin-bottom: 0; }

  /* Desktop: dense table, not a spreadsheet — generous row height,
     tabular numerals, expandable inline detail row per position. */
  .positions-table { display: none; }
  @media (min-width: 1024px) {
    .positions-table { display: block; }
    .positions-cards { display: none; }
  }
  table.pos-table { width: 100%; border-collapse: collapse; }
  .pos-table thead th {
    text-align: left; font-size: var(--text-caption); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--content-tertiary);
    padding: var(--space-3) var(--space-3); border-bottom: 1px solid var(--border-subtle);
    background: none; cursor: pointer; user-select: none;
  }
  .pos-table thead th:hover { color: var(--content-secondary); }
  .pos-table thead th .sort-icon { opacity: 0; margin-left: var(--space-1); }
  .pos-table thead th.sorted .sort-icon { opacity: 1; }
  .pos-table tbody tr.pos-row {
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer; transition: background var(--dur-micro) var(--ease-standard);
  }
  .pos-table tbody tr.pos-row:hover { background: var(--surface-1); }
  .pos-table tbody tr.pos-row:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
  .pos-table td { padding: var(--space-3); font-size: var(--text-body-m); vertical-align: middle; }
  .td-symbol { display: flex; align-items: center; gap: var(--space-2); font-weight: var(--weight-semibold); }
  .expand-chevron { color: var(--content-tertiary); transition: transform var(--dur-transition) var(--ease-standard); flex-shrink: 0; }
  .pos-row.expanded .expand-chevron { transform: rotate(90deg); }
  .pos-row.expanded { background: var(--surface-1); }
  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td { padding: 0; border-bottom: 1px solid var(--border-subtle); }
  .detail-inner { padding: var(--space-4) var(--space-5); background: var(--surface-1); display: flex; gap: var(--space-6); flex-wrap: wrap; }
  .detail-item { min-width: 140px; }
  .detail-actions { display: flex; gap: var(--space-2); margin-left: auto; align-self: center; }

  /* Mobile/tablet: card layout, kept, restyled */
  .positions-cards { display: block; }
  @media (min-width: 1024px) { .positions-cards { display: none; } }

  .pos-card {
    background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    padding: var(--space-4); margin-bottom: var(--space-3);
  }
  .pos-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: 2px; }
  .pos-sym-row { display: flex; align-items: center; gap: var(--space-2); }
  .pos-sym { font-size: var(--text-title-s); font-weight: var(--weight-bold); }
  .pos-qty { font-size: var(--text-body-s); color: var(--content-tertiary); margin-bottom: var(--space-3); }

  .pos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-2); margin-bottom: var(--space-3); }
  .pos-metric-label { font-size: var(--text-caption); color: var(--content-tertiary); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .pos-metric-val { font-size: var(--text-data-m); font-weight: var(--weight-semibold); }

  .sl-target-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .no-sl-note { font-size: var(--text-body-s); color: var(--content-tertiary); margin-bottom: var(--space-3); }

  .pos-actions { display: flex; gap: var(--space-2); }
  .pos-actions .btn { flex: 1; }
  .pos-actions .btn-more { flex: 0 0 44px; padding: 0; }

  .empty-icon-lg { width: 40px; height: 40px; color: var(--content-tertiary); opacity: 0.5; margin-bottom: var(--space-3); }

  /* .icon/.icon-sm are shared, defined once in components.css. */
</style>
</head>
<body>
<div class="page-shell">
{nav}
<div class="page-shell-content page-content">

  <h1 class="title-l" style="margin-bottom: var(--space-1)">Positions</h1>
  <p class="text-tertiary" style="font-size: var(--text-body-s); margin: 0 0 var(--space-4)">Live prices via WebSocket — no polling.</p>

  <div class="card card-pad pin-card" id="pinCard">
    <label for="pin">PIN</label>
    <div class="pin-row">
      <div class="field" style="margin-bottom:0">
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"
               aria-label="Trading PIN" onkeyup="if(event.key==='Enter')load()" oninput="onPinInput()">
      </div>
      <button class="btn btn-secondary" onclick="load()"><i data-lucide="unlock" class="icon icon-sm"></i>Unlock</button>
    </div>
    <div class="banner hidden" id="pinMsg" role="alert"></div>
  </div>

  <div class="summary-bar hidden" id="summaryBar">
    <div class="summary-inner">
      <div>
        <div class="summary-pnl-label caption">Total P&amp;L</div>
        <div class="data summary-pnl-value live-value" id="statPnl">—</div>
        <div class="summary-meta" id="statMeta">—</div>
      </div>
      <span class="conn-badge" id="connBadge" role="status">
        <span class="status-dot" id="connDot"></span><span id="connText">Not connected</span>
      </span>
    </div>
  </div>

  <div id="loadingState" class="hidden">
    <div class="card card-pad" style="margin-bottom: var(--space-3)">
      <div class="skeleton skel-line" style="width: 30%"></div>
      <div class="skeleton skel-line-lg" style="width: 50%; margin-top: var(--space-2)"></div>
      <div class="skeleton skel-line" style="width: 70%; margin-top: var(--space-3)"></div>
    </div>
    <div class="card card-pad">
      <div class="skeleton skel-line" style="width: 30%"></div>
      <div class="skeleton skel-line-lg" style="width: 50%; margin-top: var(--space-2)"></div>
      <div class="skeleton skel-line" style="width: 70%; margin-top: var(--space-3)"></div>
    </div>
  </div>

  <!-- Desktop dense table -->
  <div class="positions-table" id="positionsTable"></div>

  <!-- Mobile/tablet cards -->
  <div class="positions-cards" id="positionsList"></div>

</div>
</div>

<div class="modal-backdrop sheet-bottom" id="modifyBackdrop">
  <div class="modal">
    <h2 id="modifySym">Modify SL / Target</h2>
    <div class="modal-row">
      <div class="field">
        <label for="modSlTrigger">SL trigger</label>
        <input id="modSlTrigger" type="number" min="0" step="0.05" placeholder="e.g. 2820" inputmode="decimal">
      </div>
      <div class="field">
        <label for="modSlLimit">SL limit</label>
        <input id="modSlLimit" type="number" min="0" step="0.05" placeholder="defaults to trigger" inputmode="decimal">
      </div>
    </div>
    <div class="modal-row">
      <div class="field">
        <label for="modTgtTrigger">Target trigger</label>
        <input id="modTgtTrigger" type="number" min="0" step="0.05" placeholder="e.g. 2950" inputmode="decimal">
      </div>
      <div class="field">
        <label for="modTgtLimit">Target limit</label>
        <input id="modTgtLimit" type="number" min="0" step="0.05" placeholder="defaults to trigger" inputmode="decimal">
      </div>
    </div>
    <div style="display:flex; gap: var(--space-2); margin-top: var(--space-4)">
      <button class="btn btn-secondary" onclick="closeModal('modifyBackdrop')">Cancel</button>
      <button class="btn btn-primary btn-block" id="modifySaveBtn" onclick="saveModify()">
        <span id="modifySaveLabel">Save changes</span>
        <span class="spinner hidden" id="modifySpinner" aria-hidden="true"></span>
      </button>
    </div>
    <div class="banner hidden" id="modifyMsg" role="alert"></div>
  </div>
</div>

<script>
let positions = [];
let ws = null;
let wsRetryMs = 1000;
let modifyTarget = null; // {symbol, broker_order_id}
let pinAutoLoaded = false; // fires load() once the PIN looks complete, so a
                           // mobile keyboard's "Done" button (which doesn't
                           // fire a keyup Enter like a desktop Return key
                           // does) isn't the only way to connect — the
                           // explicit Unlock button covers the rest.
let expandedIndex = null;
let sortKey = null;
let sortDir = 1;

function currentPin(){ return document.getElementById("pin").value.trim(); }
function onPinInput(){
  var pin = currentPin();
  if (pin.length >= 4 && !pinAutoLoaded){ pinAutoLoaded = true; load(); }
  if (pin.length < 4){ pinAutoLoaded = false; }
}
// showBanner/hideBanner/fmtMoney are shared, defined once in app.js.

function setConn(state, text){
  var dot = document.getElementById("connDot");
  var badge = document.getElementById("connBadge");
  dot.className = "status-dot" + (state ? " " + state : "");
  badge.classList.toggle("down", state === "down");
  document.getElementById("connText").textContent = text;
}

async function load(){
  var pin = currentPin();
  hideBanner("pinMsg");
  if (!pin){ showBanner("pinMsg", "banner-error", "Enter your PIN."); return; }

  document.getElementById("summaryBar").classList.add("hidden");
  document.getElementById("positionsTable").innerHTML = "";
  document.getElementById("positionsList").innerHTML = "";
  document.getElementById("loadingState").classList.remove("hidden");

  try {
    var r = await fetch("/positions/data?pin=" + encodeURIComponent(pin));
    var d = await r.json();
    document.getElementById("loadingState").classList.add("hidden");
    if (!r.ok){
      showBanner("pinMsg", "banner-error", d.error || ("Error " + r.status));
      return;
    }
    positions = d.positions || [];
    document.getElementById("summaryBar").classList.remove("hidden");
    renderPositions();
    renderSummary();
    connectWs(pin);
  } catch (e) {
    document.getElementById("loadingState").classList.add("hidden");
    showBanner("pinMsg", "banner-error", String(e));
  }
}

function renderSummary(){
  var totalPnl = positions.reduce(function(s, p){ return s + (p.pnl || 0); }, 0);
  var el = document.getElementById("statPnl");
  el.textContent = fmtMoney(totalPnl);
  el.className = "data summary-pnl-value live-value " + (totalPnl >= 0 ? "buy-color" : "sell-color");
  document.getElementById("statMeta").textContent = positions.length + (positions.length === 1 ? " position" : " positions");
}

function instrumentKey(p){ return p.security_id ? (p.exchange + ":" + p.security_id) : null; }

function protectionBadges(sl){
  if (!sl) return '<span class="text-tertiary" style="font-size: var(--text-body-s)">No stop set</span>';
  var badges = [];
  if (sl.sl_trigger_price) badges.push('<span class="badge badge-sell">SL ₹' + sl.sl_trigger_price + '</span>');
  if (sl.tgt_trigger_price) badges.push('<span class="badge badge-buy">Target ₹' + sl.tgt_trigger_price + '</span>');
  if (sl.trailing_sl_points) badges.push('<span class="badge badge-info">Trailing ' + sl.trailing_sl_points + 'pt</span>');
  return badges.join(" ");
}

function sortedIndices(){
  var idx = positions.map(function(_, i){ return i; });
  if (!sortKey) return idx;
  idx.sort(function(a, b){
    var va = positions[a][sortKey] || 0, vb = positions[b][sortKey] || 0;
    if (typeof va === "string") return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
  return idx;
}
function sortBy(key){
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  renderPositions();
}

function renderPositions(){
  var tableEl = document.getElementById("positionsTable");
  var listEl = document.getElementById("positionsList");

  if (!positions.length){
    var emptyHtml =
      '<div class="card card-pad empty-state">' +
      '<i data-lucide="inbox" class="icon empty-icon-lg" style="margin:0 auto var(--space-3)"></i>' +
      '<h2 class="title-m">No open positions</h2>' +
      '<p>Place an order to see it appear here.</p>' +
      '<a href="/trade" class="btn btn-primary"><i data-lucide="arrow-left-right" class="icon icon-sm"></i>Place an order</a>' +
      '</div>';
    tableEl.innerHTML = emptyHtml;
    listEl.innerHTML = emptyHtml;
    renderIcons();
    return;
  }

  var order = sortedIndices();

  // Desktop table
  var head =
    '<table class="pos-table"><thead><tr>' +
    th("Symbol", "symbol") + th("Exch", "exchange") + th("Qty", "quantity") +
    th("Avg", "avg_price") + '<th>LTP</th><th>P&amp;L</th><th>Protection</th><th></th>' +
    '</tr></thead><tbody>';
  var body = order.map(function(i){ return tableRow(positions[i], i); }).join("");
  tableEl.innerHTML = head + body + '</tbody></table>';

  function th(label, key){
    var sorted = sortKey === key;
    return '<th onclick="sortBy(\'' + key + '\')" class="' + (sorted ? "sorted" : "") + '">' + label +
      '<i data-lucide="' + (sorted && sortDir < 0 ? "chevron-up" : "chevron-down") + '" class="icon icon-sm sort-icon"></i></th>';
  }
  function tableRow(p, i){
    var pnlClass = (p.pnl || 0) >= 0 ? "buy-color" : "sell-color";
    var canModify = p.sl_target && p.sl_target.broker_order_id;
    var expanded = expandedIndex === i;
    var rowHtml =
      '<tr class="pos-row' + (expanded ? " expanded" : "") + '" id="row-' + i + '" tabindex="0" role="button" ' +
      'aria-expanded="' + expanded + '" onclick="toggleExpand(' + i + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleExpand(' + i + ')}">' +
      '<td><div class="td-symbol"><i data-lucide="chevron-right" class="icon icon-sm expand-chevron"></i>' + p.symbol + '</div></td>' +
      '<td class="text-tertiary">' + p.exchange + '</td>' +
      '<td class="data">' + p.quantity + '</td>' +
      '<td class="data">₹' + (p.avg_price || 0).toLocaleString() + '</td>' +
      '<td class="data live-value" id="ltp-' + i + '">₹' + (p.current_price || 0).toLocaleString() + '</td>' +
      '<td class="data live-value ' + pnlClass + '" id="pnl-' + i + '">' + fmtMoney(p.pnl || 0) + '</td>' +
      '<td>' + protectionBadges(p.sl_target) + '</td>' +
      '<td class="text-tertiary" style="text-align:right"><i data-lucide="more-horizontal" class="icon icon-sm"></i></td>' +
      '</tr>';
    var detailHtml =
      '<tr class="detail-row' + (expanded ? " open" : "") + '" id="detail-' + i + '"><td colspan="8"><div class="detail-inner">' +
      '<div class="detail-item"><div class="caption">Product</div><div class="data-m data">' + (p.product || "—") + '</div></div>' +
      '<div class="detail-item"><div class="caption">Kind</div><div class="data-m data">' + p.kind + '</div></div>' +
      '<div class="detail-actions">' +
      '<button class="btn btn-sell btn-sm" onclick="event.stopPropagation();sellPosition(' + i + ')" id="sellBtn-' + i + '"><span id="sellBtnLabel-' + i + '">Sell @ market</span></button>' +
      '<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openModify(' + i + ')" ' + (canModify ? "" : "disabled") + '>Modify</button>' +
      '<a class="btn btn-ghost btn-sm" href="/trade?symbol=' + encodeURIComponent(p.symbol) + '&exchange=' + encodeURIComponent(p.exchange) + '&security_id=' + encodeURIComponent(p.security_id || "") + '&segment=' + encodeURIComponent(p.segment || "") + '" onclick="event.stopPropagation()">Full order form</a>' +
      '</div></div></td></tr>';
    return rowHtml + detailHtml;
  }

  // Mobile/tablet cards
  listEl.innerHTML = order.map(function(i){ return posCard(positions[i], i); }).join("");
  renderIcons();

  function posCard(p, i){
    var pnlClass = (p.pnl || 0) >= 0 ? "buy-color" : "sell-color";
    var canModify = p.sl_target && p.sl_target.broker_order_id;
    return (
      '<div class="pos-card" id="poscard-' + i + '">' +
      '<div class="pos-head"><div class="pos-sym-row"><span class="pos-sym">' + p.symbol + '</span>' +
      '<span class="badge badge-neutral">' + p.exchange + '</span><span class="badge badge-neutral">' + p.kind + '</span></div></div>' +
      '<div class="pos-qty">Qty ' + p.quantity + ' @ avg ₹' + (p.avg_price || 0).toLocaleString() + '</div>' +
      '<div class="pos-grid">' +
      '<div><div class="pos-metric-label">LTP</div><div class="data pos-metric-val live-value" id="ltp-' + i + '">₹' + (p.current_price || 0).toLocaleString() + '</div></div>' +
      '<div><div class="pos-metric-label">P&amp;L</div><div class="data pos-metric-val live-value ' + pnlClass + '" id="pnl-' + i + '">' + fmtMoney(p.pnl || 0) + '</div></div>' +
      '<div><div class="pos-metric-label">Qty</div><div class="data pos-metric-val">' + p.quantity + '</div></div>' +
      '</div>' +
      '<div class="sl-target-row">' + protectionBadges(p.sl_target) + '</div>' +
      '<div class="pos-actions">' +
      '<button class="btn btn-sell" onclick="sellPosition(' + i + ')" id="sellBtnCard-' + i + '"><span id="sellBtnCardLabel-' + i + '">Sell @ market</span></button>' +
      '<button class="btn btn-secondary" onclick="openModify(' + i + ')" ' + (canModify ? "" : 'disabled aria-label="No active SL/Target order on file for this position"') + '>Modify</button>' +
      '<a class="btn btn-ghost btn-more" href="/trade?symbol=' + encodeURIComponent(p.symbol) + '&exchange=' + encodeURIComponent(p.exchange) + '&security_id=' + encodeURIComponent(p.security_id || "") + '&segment=' + encodeURIComponent(p.segment || "") + '" aria-label="Open ' + p.symbol + ' in the full order form"><i data-lucide="more-horizontal" class="icon icon-sm"></i></a>' +
      '</div></div>'
    );
  }
}

function toggleExpand(i){
  var wasOpen = expandedIndex === i;
  var prevIndex = expandedIndex;
  expandedIndex = wasOpen ? null : i;
  if (prevIndex != null && prevIndex !== i){
    var prevRow = document.getElementById("row-" + prevIndex);
    var prevDetail = document.getElementById("detail-" + prevIndex);
    if (prevRow) { prevRow.classList.remove("expanded"); prevRow.setAttribute("aria-expanded", "false"); }
    if (prevDetail) prevDetail.classList.remove("open");
  }
  var row = document.getElementById("row-" + i);
  var detail = document.getElementById("detail-" + i);
  if (row) { row.classList.toggle("expanded", !wasOpen); row.setAttribute("aria-expanded", String(!wasOpen)); }
  if (detail) detail.classList.toggle("open", !wasOpen);
}

function connectWs(pin){
  if (ws){ ws.close(); ws = null; }
  var instruments = positions.map(instrumentKey).filter(Boolean);
  if (!instruments.length){ setConn("", "No live-priceable positions"); return; }

  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  var url = proto + "//" + location.host + "/ws/prices?pin=" + encodeURIComponent(pin) +
             "&instruments=" + encodeURIComponent(instruments.join(","));
  setConn("", "Connecting…");
  ws = new WebSocket(url);

  ws.onopen = function(){ wsRetryMs = 1000; };
  ws.onmessage = function(evt){
    var msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    if (msg.type === "error"){ setConn("down", msg.message || "Connection error"); return; }
    if (msg.type === "snapshot"){
      setConn("live", "Live");
      Object.entries(msg.prices || {}).forEach(function(entry){ applyTick(entry[0], entry[1]); });
      return;
    }
    if (msg.type === "tick"){
      setConn("live", "Live");
      applyTick(msg.instrument, msg.ltp);
    }
  };
  ws.onclose = function(){
    setConn("down", "Reconnecting…");
    setTimeout(function(){ if (currentPin()) connectWs(currentPin()); }, wsRetryMs);
    wsRetryMs = Math.min(wsRetryMs * 2, 15000);
  };
  ws.onerror = function(){};
}

// Only the specific LTP/P&L values that changed are updated and flashed —
// never the whole row/card (per Phase 5 requirement). Uses the shared
// flashValue() helper from app.js (Phase 1), same primitive Trade's live
// quote panel uses.
function applyTick(instrument, ltp){
  positions.forEach(function(p, i){
    if (instrumentKey(p) !== instrument) return;
    p.current_price = ltp;
    // quantity is signed (negative for a short position, per INDstocks'
    // net_quantity convention — see INDmoneyBroker.get_positions), so this
    // naturally flips sign for shorts without a separate side flag.
    p.pnl = (ltp - (p.avg_price || 0)) * (p.quantity || 0);

    ["ltp-" + i, "pnl-" + i].forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      setStale(el, false);
    });
    var ltpEl = document.getElementById("ltp-" + i);
    var pnlEl = document.getElementById("pnl-" + i);
    if (ltpEl && ltpEl.textContent !== "₹" + ltp.toLocaleString()){
      ltpEl.textContent = "₹" + ltp.toLocaleString();
      flashValue(ltpEl);
    }
    if (pnlEl){
      var newText = fmtMoney(p.pnl);
      if (pnlEl.textContent !== newText){
        pnlEl.textContent = newText;
        pnlEl.className = pnlEl.className.replace(/\b(buy|sell)-color\b/g, "") + " " + (p.pnl >= 0 ? "buy-color" : "sell-color");
        flashValue(pnlEl);
      }
    }
  });
  renderSummary();
}

async function sellPosition(i){
  var p = positions[i];
  var btnIds = ["sellBtn-" + i, "sellBtnCard-" + i];
  var labelIds = ["sellBtnLabel-" + i, "sellBtnCardLabel-" + i];
  btnIds.forEach(function(id, idx){
    var btn = document.getElementById(id);
    if (btn){ btn.disabled = true; document.getElementById(labelIds[idx]).textContent = "Selling…"; }
  });
  try {
    var r = await fetch("/trade/sell", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        pin: currentPin(), symbol: p.symbol, security_id: p.security_id,
        segment: p.segment, exchange: p.exchange, quantity: p.quantity,
        product: p.product || "INTRADAY", order_type: "MARKET",
      }),
    });
    var d = await r.json();
    if (r.ok && d.status === "ok"){
      showBanner("pinMsg", "banner-success", "Sold " + p.symbol + ". Order ID: " + (d.order_id || "—"));
      load();
    } else {
      showBanner("pinMsg", "banner-error", d.error || d.message || d.order_status || "Sell failed");
      btnIds.forEach(function(id, idx){
        var btn = document.getElementById(id);
        if (btn){ btn.disabled = false; document.getElementById(labelIds[idx]).textContent = "Sell @ market"; }
      });
    }
  } catch (e) {
    showBanner("pinMsg", "banner-error", String(e));
    btnIds.forEach(function(id, idx){
      var btn = document.getElementById(id);
      if (btn){ btn.disabled = false; document.getElementById(labelIds[idx]).textContent = "Sell @ market"; }
    });
  }
}

function openModify(i){
  var p = positions[i];
  if (!p.sl_target || !p.sl_target.broker_order_id) return;
  modifyTarget = { symbol: p.symbol, broker_order_id: p.sl_target.broker_order_id };
  document.getElementById("modifySym").textContent = "Modify " + p.symbol;
  document.getElementById("modSlTrigger").value = p.sl_target.sl_trigger_price || "";
  document.getElementById("modSlLimit").value = "";
  document.getElementById("modTgtTrigger").value = p.sl_target.tgt_trigger_price || "";
  document.getElementById("modTgtLimit").value = "";
  hideBanner("modifyMsg");
  openModal("modifyBackdrop");
}

async function saveModify(){
  if (!modifyTarget) return;
  var btn = document.getElementById("modifySaveBtn");
  var label = document.getElementById("modifySaveLabel");
  var spinner = document.getElementById("modifySpinner");
  btn.disabled = true; label.textContent = "Saving…"; spinner.classList.remove("hidden");
  var num = function(id){ var v = parseFloat(document.getElementById(id).value); return (v > 0) ? v : null; };
  try {
    var r = await fetch("/trade/modify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        pin: currentPin(), order_id: modifyTarget.broker_order_id,
        sl_trigger_price: num("modSlTrigger"), sl_limit_price: num("modSlLimit"),
        tgt_trigger_price: num("modTgtTrigger"), tgt_limit_price: num("modTgtLimit"),
      }),
    });
    var d = await r.json();
    if (r.ok && d.status === "ok"){
      showBanner("modifyMsg", "banner-success", "Updated.");
      setTimeout(function(){ closeModal("modifyBackdrop"); load(); }, 900);
    } else {
      showBanner("modifyMsg", "banner-error", d.error || d.message || "Modify failed");
    }
  } catch (e) {
    showBanner("modifyMsg", "banner-error", String(e));
  } finally {
    btn.disabled = false; label.textContent = "Save changes"; spinner.classList.add("hidden");
  }
}

renderIcons();
</script>
