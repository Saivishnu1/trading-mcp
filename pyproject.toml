[project]
name = "zerodha-mcp"
version = "1.0.0"
description = "Zerodha personal-account MCP server"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Sai Vishnu Mummineni", email = "saivishnu1652@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "zerodha", "trading", "nse", "options", "oauth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "mcp[cli]>=1.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",

    # broker backends
    "httpx>=0.27.0",          # primary: direct Zerodha web API
    "jugaad-trader>=0.20",    # fallback broker
    "websockets>=13.0",       # INDstocks live price + order-update streams

    # market data
    "jugaad-data>=0.33.1",    # primary: NSE live quotes
    "yfinance>=0.2.40",       # fallback + historical data

    # auth
    "pyotp>=2.9.0",           # TOTP generation from secret
    "python-telegram-bot>=22.0",  # telegram admin bot

    # Phase 9A — live position monitor (market-hours scheduling in IST)
    "pytz>=2024.1",

    # journal persistence (Railway x86_64 only; Oracle ARM uses PostgreSQL)
    "libsql-experimental>=0.0.6; platform_machine == 'x86_64'",

    # PostgreSQL — Oracle VM production database
    "sqlalchemy[asyncio]>=2.0.0; sys_platform == 'linux'",
    "asyncpg>=0.29.0; sys_platform == 'linux'",
    "alembic>=1.13.0; sys_platform == 'linux'",
    "psycopg2-binary>=2.9.0; sys_platform == 'linux'",
]

[project.scripts]
zerodha-mcp = "src.server:main"
zerodha-mcp-stdio = "src.server:main_stdio"
telegram-admin = "src.telegram_admin.main:main"

[project.urls]
Homepage = "https://github.com/Saivishnu1/trading-mcp"
Repository = "https://github.com/Saivishnu1/trading-mcp"
Documentation = "https://github.com/Saivishnu1/trading-mcp#readme"
Issues = "https://github.com/Saivishnu1/trading-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/server.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
# Measured at 73% (2026-09-01) with src/server.py excluded from coverage
# (see the `omit` above -- server.py is a separate, tracked cleanup, not
# this threshold's problem). Set a few points below the measured value so
# normal variance doesn't fail CI on day one; ratchet upward over time
# rather than resetting it down when it's inconvenient.
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "src/ui/shared/vendor"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "T20",     # flake8-print — locks in the existing zero-print(...) invariant
    "RUF",
]
ignore = [
    "E501",   # line length — not worth enforcing retroactively
    "B008",   # function call in default arg — common pattern here (Depends-style)
    "SIM105", # contextlib.suppress — deliberately not used; see src/market/calendar.py fixes

    # --- Pending bulk cleanup, ignored so `ruff check` is a real CI gate
    # today instead of red on ~300 pre-existing violations (measured
    # 2026-09-01, right after enabling this config -- these predate the
    # ruff adoption itself, not a regression). Each is a real, valid rule;
    # narrow it down module-by-module as those files are next touched for
    # a feature, rather than a rushed bulk fix under deploy pressure (an
    # earlier bulk --fix pass on this exact config broke an import at
    # runtime -- see git blame on src/catalyst/constants.py/earnings.py --
    # confirming that rushing these is a real way to introduce bugs, not
    # just churn).
    "RUF059", # unused-unpacked-variable — mostly OHLC-style tuple unpacks
              # that only use some fields; needs a per-site check, not a
              # blind underscore-prefix
    "E741",   # ambiguous-variable-name — mostly single-letter OHLC locals
              # (o/h/l/c) that are domain-idiomatic here, not accidental
    "RUF002", "RUF003", # ambiguous-unicode-character — mostly the em-dashes
              # and arrows (—/→) used throughout this codebase's own
              # comments/docstrings; not actually ambiguous in context
    "B905",   # zip-without-explicit-strict — needs checking each zip() call
              # site for whether mismatched-length inputs are a real
              # possibility before adding strict=True/False
    "SIM115", # open-file-with-context-handler — some of these are
              # deliberately-scoped file handles (e.g. a flock held for the
              # process lifetime in src/monitor/service.py), not bugs
    "F841",   # unused-variable — needs a per-site check for whether the
              # value is intentionally discarded (e.g. destructuring for
              # readability) vs. genuinely dead
    "E402",   # module-import-not-at-top-of-file — this codebase's own
              # convention for avoiding circular imports is a late,
              # function-adjacent import with a "single source of truth"
              # comment; each of the ~16 occurrences needs confirming
              # that's actually why before restructuring, not a blind move

    # The remaining ~78 (measured 2026-09-01) are genuine simplification/
    # style suggestions, not correctness risks -- audited category-by-
    # category (not just counted) before deciding to defer: SIM117 nested
    # `with`, RUF012 mutable class defaults, C408/C401 verbose
    # dict()/set() calls, E701 semicolon statements, RUF007 zip->pairwise,
    # SIM102 collapsible if, RUF001/RUF005/SIM108/UP042/RUF046 assorted
    # single-digit-count style nits. None of these showed the shape of a
    # real bug when sampled (unlike RUF006/B006/B007/F811/F401 above,
    # which WERE real and are fixed, not ignored). Clean these up
    # module-by-module as those files are next touched.
    "SIM117", "RUF012", "C408", "E701", "RUF007", "SIM102", "C401",
    "RUF001", "RUF005", "SIM108", "UP042", "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F401", "B011", "T20"]
"scripts/**" = ["T20"]       # research scripts legitimately print
"src/server.py" = ["E402"]  # import order is load-bearing there

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["^migrations/", "^src/ui/"]
# Type-check against the actual deploy target (Oracle VM, Linux), not
# whatever OS runs mypy -- otherwise typeshed's fcntl stub (POSIX-only
# flock/LOCK_EX/etc.) reports false attr-defined errors on a Windows dev
# machine for code that only ever runs on Linux in production.
platform = "linux"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true  # jugaad-data, jugaad-trader, mplfinance ship no stubs

# The two messiest I/O-boundary modules (telegram formatting/conversation
# state, the composite market-awareness engine) generate ~250 combined
# errors that are mostly Optional-narrowing noise around external API
# responses, not caught bugs. Excluded here rather than silently
# accumulating # type: ignore comments; revisit when those modules are
# next touched for a feature, not as a standalone typing pass.
[[tool.mypy.overrides]]
module = ["src.telegram_admin.handlers", "src.market_awareness.engine"]
ignore_errors = true

# Tier 3 — messy I/O boundaries (external APIs, Telegram, multi-broker
# adapters). Untyped-def bodies aren't checked, but the module still gets
# the repo-wide floor above.
[[tool.mypy.overrides]]
module = ["src.server", "src.telegram_admin.*", "src.brokers.*"]
check_untyped_defs = false

# Tier 2 — pure computation, no external-API surface: near-zero churn to
# hold strict, and a type error here is a correctness bug (position
# sizing, indicator math, the trust envelope), not a plumbing bug.
[[tool.mypy.overrides]]
module = ["src.technical.*", "src.common.*", "src.sizer.*", "src.meta", "src.charts.styles"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true