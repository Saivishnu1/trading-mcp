[project]
name = "zerodha-mcp"
version = "0.1.1"
description = "Zerodha personal-account MCP server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp[cli]>=1.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
    # broker backends
    "httpx>=0.27.0",          # primary: direct Zerodha web API
    "jugaad-trader>=0.20",    # fallback broker (latest: 0.20)
    # market data
    "jugaad-data>=0.33.1",   # primary: NSE live quotes (latest: 0.33.1)
    "yfinance>=0.2.40",       # fallback + historical data
    # auth
    "pyotp>=2.9.0",           # TOTP generation from secret
    # journal persistence (Linux/Railway only — Windows has no pre-built wheel)
    "libsql-experimental>=0.0.6; sys_platform == 'linux'",
    # PostgreSQL — Oracle VM production database (Linux only; not needed on Windows dev)
    "sqlalchemy[asyncio]>=2.0.0; sys_platform == 'linux'",
    "asyncpg>=0.29.0; sys_platform == 'linux'",
    "alembic>=1.13.0; sys_platform == 'linux'",
]

[project.scripts]
zerodha-mcp = "src.server:main"
zerodha-mcp-stdio = "src.server:main_stdio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/server.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
