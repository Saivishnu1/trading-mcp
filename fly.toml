# Deploy with: fly launch (first time) or fly deploy (updates)
# Set secrets with: fly secrets set ZERODHA_USER_ID=xxx ZERODHA_PASSWORD=xxx ZERODHA_TOTP_SECRET=xxx

app = "zerodha-mcp"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
