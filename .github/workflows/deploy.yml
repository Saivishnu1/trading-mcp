name: Deploy to Oracle

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd ~/trading-mcp

            git fetch origin
            git reset --hard origin/main

            ~/.local/bin/uv sync

            # Migrate BEFORE restarting either service — never let a service
            # start against a schema it doesn't match (2026-07-11: this step
            # was previously missing entirely, leaving the DB 5 migrations
            # behind deployed code with no error surfaced).
            set -a && source /etc/zerodha-mcp/.env && set +a
            ~/.local/bin/uv run alembic upgrade head

            sudo systemctl daemon-reload
            # zerodha-monitor is a separate long-running process that reads
            # the same DB schema and alert logic as zerodha-mcp — restarting
            # only zerodha-mcp left the monitor running stale code
            # indefinitely (2026-07-11: found running code from the day
            # before while zerodha-mcp was on the latest deploy).
            sudo systemctl restart zerodha-mcp zerodha-monitor

            sudo systemctl is-active zerodha-mcp
            sudo systemctl is-active zerodha-monitor
