name: Deploy to Oracle

# Runs after CI (ci.yml) completes on main, instead of independently on
# every push -- CI's own test job already covers what this workflow used
# to re-run itself (a duplicate "Run tests" step, confirmed wasteful and
# confusing in the Actions UI: two separate workflow runs on every push,
# each running the full suite). This also closes a real gap the old
# `on: push` trigger had: a push whose tests fail could still reach
# deploy.yml's OWN quick pytest run and pass it independently, with no
# guarantee that run agreed with CI's. Now deploy only proceeds when CI's
# workflow_run reports conclusion == 'success', checked explicitly below
# rather than assumed from the trigger firing at all (workflow_run fires
# on ANY conclusion, success or failure, so that check is load-bearing,
# not decorative).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit CI actually ran against, not whatever
          # main happens to point at when this workflow_run fires --
          # those can differ if another push landed on main in the
          # window between CI starting and this trigger firing.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd ~/trading-mcp

            git fetch origin
            git reset --hard origin/main

            ~/.local/bin/uv sync

            # Migrate BEFORE restarting either service — never let a service
            # start against a schema it doesn't match (2026-07-11: this step
            # was previously missing entirely, leaving the DB 5 migrations
            # behind deployed code with no error surfaced).
            set -a && source /etc/zerodha-mcp/.env && set +a
            ~/.local/bin/uv run alembic upgrade head

            # Idempotent, safe on every deploy — only inserts the
            # /ws/prices WebSocket location block if it's missing, never
            # touches anything certbot has added to the nginx config (see
            # sync_nginx_ws_config.sh's header for why a full config regen
            # here would be unsafe). No-op if nginx isn't set up yet.
            if [ -f /etc/nginx/sites-available/zerodha-mcp ]; then
              sudo bash infra/sync_nginx_ws_config.sh
            fi

            sudo systemctl daemon-reload
            # zerodha-monitor is a separate long-running process that reads
            # the same DB schema and alert logic as zerodha-mcp — restarting
            # only zerodha-mcp left the monitor running stale code
            # indefinitely (2026-07-11: found running code from the day
            # before while zerodha-mcp was on the latest deploy).
            # telegram-admin is a third long-running process (PTB long-poll
            # loop) that imports src/telegram_admin/* directly — it was
            # missing from this restart list, so /buy /sell /search and any
            # other bot command changes silently kept running the old code
            # on the VM until someone restarted it by hand (2026-07-11).
            sudo systemctl restart zerodha-mcp zerodha-monitor telegram-admin

            sudo systemctl is-active zerodha-mcp
            sudo systemctl is-active zerodha-monitor
            sudo systemctl is-active telegram-admin
